{{- if .Values.serviceAccount.create }}
# Own identity for the app pods; no API token mounted (the app never calls the Kubernetes API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "student-app.serviceAccountName" . }}
  labels:
    {{- include "student-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
