{{- if .Values.pdb.enabled }}
# Node drains / upgrades evict at most maxUnavailable app pods at a time (scenario 66).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "student-app.fullname" . }}
  labels:
    {{- include "student-app.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  # A crash-looping pod is already down: don't let it block a drain.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "student-app.selectorLabels" . | nindent 6 }}
{{- end }}
