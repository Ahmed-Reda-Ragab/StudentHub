            )
            /
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[3d]))
        - record: student_app:sli_availability_errors:ratio_rate5m
          expr: |-
            (
              sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[5m]))
              or
              0 * sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
            )
            /
            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
        - record: student_app:sli_availability_errors:ratio_rate30m
