# SSM Parameter Store → Secret "student-app-secrets" (CONVENTIONS §4 layout):
#   /student-app/lab/app/APP_KEY      → APP_KEY
#   /student-app/lab/app/DB_PASSWORD  → DB_PASSWORD   ... one parameter = one env var
# Rotating a value in SSM updates the Secret within refreshInterval; pods pick it up on their next
# restart (env is read at start — use `kubectl rollout restart` or Stakater Reloader).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: student-app-secrets
  labels:
    app.kubernetes.io/name: student-app
  annotations:
    # Must exist before the migrate Job (wave 0) and the Deployment (wave 1) that consume it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-parameter-store
  target:
    name: student-app-secrets
    creationPolicy: Owner
    # If someone deletes the parameters, keep the last good Secret instead of breaking every new pod.
    deletionPolicy: Retain
  dataFrom:
    # Every parameter under the path (GetParametersByPath, recursive, decrypted)...
    - find:
        path: /student-app/lab/app
        name:
          regexp: ".*"
      # ...keys arrive as full names (/student-app/lab/app/APP_KEY); keep only the last segment.
      rewrite:
        - regexp:
            source: "^/student-app/lab/app/(.*)$"
            target: "$1"
