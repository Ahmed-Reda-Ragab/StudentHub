# SLI recording rules - scenarios 71/73 (docs/devops/CONVENTIONS.md section 5).
#
# Availability SLI = non-5xx / all requests on APP routes. Excluded on purpose:
#   sre-lab.*                   load/chaos endpoints: they fail on request and must not burn the real budget
#   up, health.ready, metrics   probes and the scraper: cheap, always 200, they would dilute real errors
# Latency SLI = requests faster than 300ms (bucket le="0.3") / all requests on the same routes.
# Drill SLI   = only route="sre-lab.error": what loadtest/k6/error-budget-burn.js burns.
#
# Every ratio is recorded for each alert window (5m ... 3d), per job (app, app_blue and
# app_green all scrape as job="student-app") and overall. It is a ratio of summed rates,
# never an average of per-instance ratios (that would weigh an idle instance like a busy
# one). No traffic gives 0/0 = NaN, and NaN never fires an alert.
#
# Generated together with observability/k8s/prometheusrule-slo.yaml - change both.
groups:
  - name: student-app-sli-availability
    rules:
      - record: job:student_app_sli_availability_errors:ratio_rate5m
        expr: |-
          (
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[5m]))
            or
            0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
          )
          /
          sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
