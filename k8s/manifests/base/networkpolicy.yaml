# Least-privilege networking for the app pods (and the migrate Job — same name label).
# Once a pod is selected by a policy with policyTypes Egress, everything not listed is denied:
# a compromised PHP process cannot reach the internet, other namespaces or the EC2 metadata
# endpoint (169.254.169.254). Needs a CNI that enforces policies: kindnet (kind ≥ v0.24), or the
# Amazon VPC CNI with network policy enabled on EKS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: student-app
  labels:
    app.kubernetes.io/name: student-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: student-app
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Only the HTTP port. No `from`: the ALB (target-type ip, VPC addresses), NodePort traffic,
    # kubelet probes and Prometheus all need it, and none of them can be matched by a pod selector.
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    # [0] DNS to CoreDNS only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # [1] MySQL and Redis ports. Overlays narrow the destination (the MySQL pod on kind,
    #     the VPC CIDR where RDS/ElastiCache live on EKS).
    - ports:
        - port: 3306
          protocol: TCP
        - port: 6379
          protocol: TCP
