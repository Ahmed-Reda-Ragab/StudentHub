# Ansible settings for the student-app lab (scenarios 21, 33, 47, 93).
# Run every command from infra/ansible/ so this file is picked up
# (Ansible ignores ansible.cfg in a world-writable directory, e.g. /mnt/c on WSL:
#  clone the repo into the WSL filesystem, or export ANSIBLE_CONFIG=$PWD/ansible.cfg).
# Relative paths below are resolved from this file's directory.

[defaults]
# Dynamic inventory by default (tag:Project=student-app); -i overrides it.
inventory = inventories/lab/aws_ec2.yml
roles_path = roles
remote_user = ec2-user
forks = 10
timeout = 30
interpreter_python = auto_silent
retry_files_enabled = False
# Readable task results (multi-line stdout of the deploy scripts) instead of JSON blobs.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
# Lab only: EC2 instances are disposable and every new one has a new host key, so strict
# checking would just train us to type "yes". In production pin host keys (EC2 serial console /
# get-console-output fingerprints, or SSH certificates) - or use SSM and have no SSH at all.
host_key_checking = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, ini, yaml, auto

[ssh_connection]
# Pipelining sends modules over the existing SSH channel instead of copying files: much
# faster. Safe on Amazon Linux 2023 (sudo does not require a tty).
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
