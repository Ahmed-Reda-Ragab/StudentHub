# EXAMPLE ONLY — not listed in kustomization.yaml and never committed with real values.
#
# Where the real Secret comes from:
#   kind : kubectl create secret generic student-app-secrets ... (k8s/kind/README.md)
#   EKS  : External Secrets Operator syncs /student-app/<env>/app/* from SSM Parameter Store
#          (overlays/eks/externalsecret.yaml, or the Helm chart with externalSecrets.enabled=true)
#
# Shape of the Secret the Deployment expects (envFrom → every key becomes an env var):
apiVersion: v1
kind: Secret
metadata:
  name: student-app-secrets
  namespace: student-app
  labels:
    app.kubernetes.io/name: student-app
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_WITH_php_artisan_key_generate_--show"
  DB_PASSWORD: "REPLACE_ME"
  # Optional
  SRE_LAB_TOKEN: ""
  METRICS_TOKEN: ""
