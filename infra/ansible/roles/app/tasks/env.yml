---
# Result: {{ app_dir }}/app.env (+ mysql.env) mode 0600, and app_env_changed telling deploy.yml
# whether the running container must be recreated even if the image did not change.
# diff: false everywhere - `--diff` would otherwise print secrets into CI logs.

# ---- source: SSM Parameter Store (default)
# render-env-from-ssm.sh always rewrites its output, so it renders into a staging dir and the
# copy below decides whether anything really changed (idempotent, accurate "changed").
- name: Render env files from SSM into a staging directory
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      install -d -m 0700 "$STAGE"
      rm -f "$STAGE/app.env" "$STAGE/mysql.env"
      APP_DIR="$STAGE" "{{ app_dir }}/render-env-from-ssm.sh"
    executable: /bin/bash
  environment:
    STAGE: "{{ app_dir }}/.env-staging"
    ENV_NAME: "{{ app_env_name }}"
    AWS_REGION: "{{ app_aws_region }}"
  changed_when: false
  when: app_env_source == 'ssm'

- name: Find rendered env files
  ansible.builtin.stat:
    path: "{{ app_dir }}/.env-staging/{{ item }}"
  loop:
    - app.env
    - mysql.env
  register: app_staged_env
  when: app_env_source == 'ssm'

- name: Install env files rendered from SSM
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ app_dir }}/{{ item.item }}"
    remote_src: true
    owner: "{{ app_owner }}"
    group: "{{ app_owner }}"
    mode: "0600"
  loop: "{{ app_staged_env.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - app_env_source == 'ssm'
    - item.stat.exists
  register: app_env_from_ssm
  diff: false

# ---- source: ansible-vault (scenario 93)
- name: Render app.env from vault variables
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/app.env"
    owner: "{{ app_owner }}"
    group: "{{ app_owner }}"
    mode: "0600"
  vars:
    app_env_data: "{{ app_env_vars }}"
  when: app_env_source == 'vault'
  register: app_env_from_vault_app
  no_log: true
  diff: false

- name: Render mysql.env from vault variables
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/mysql.env"
    owner: "{{ app_owner }}"
    group: "{{ app_owner }}"
    mode: "0600"
  vars:
    app_env_data: "{{ app_mysql_env_vars }}"
  when:
    - app_env_source == 'vault'
    - app_use_local_mysql | bool
    - app_mysql_env_vars | length > 0
  register: app_env_from_vault_mysql
  no_log: true
  diff: false

- name: Check that app.env exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/app.env"
  register: app_env_file

- name: Fail when there is no app.env
  ansible.builtin.assert:
    that: app_env_file.stat.exists
    fail_msg: >-
      {{ app_dir }}/app.env is missing: no parameters under /student-app/{{ app_env_name }}/app/ in SSM
      (apply the Terraform stack) or set app_env_source=vault.
    quiet: true

- name: Remember whether the env changed
  ansible.builtin.set_fact:
    app_env_changed: >-
      {{ (app_env_from_ssm is changed) or (app_env_from_vault_app is changed) or (app_env_from_vault_mysql is changed) }}
