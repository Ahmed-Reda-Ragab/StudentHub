            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30m]))
        - record: student_app:sli_availability_errors:ratio_rate1h
          expr: |-
            (
              sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[1h]))
              or
              0 * sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1h]))
            )
            /
            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1h]))
        - record: student_app:sli_availability_errors:ratio_rate2h
          expr: |-
            (
              sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[2h]))
              or
              0 * sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[2h]))
            )
            /
            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[2h]))
        - record: student_app:sli_availability_errors:ratio_rate6h
          expr: |-
            (
              sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[6h]))
              or
              0 * sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[6h]))
            )
            /
            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[6h]))
        - record: student_app:sli_availability_errors:ratio_rate1d
          expr: |-
            (
              sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[1d]))
              or
              0 * sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1d]))
            )
            /
            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1d]))
        - record: student_app:sli_availability_errors:ratio_rate3d
          expr: |-
            (
              sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[3d]))
              or
              0 * sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[3d]))
            )
            /
            sum(rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[3d]))
    - name: student-app-sli-latency
      rules:
        - record: job:student_app_sli_latency_good:ratio_rate5m
          expr: |-
            sum by (job) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[5m]))
            /
            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
        - record: job:student_app_sli_latency_good:ratio_rate30m
          expr: |-
            sum by (job) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[30m]))
            /
            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30m]))
        - record: job:student_app_sli_latency_good:ratio_rate1h
          expr: |-
            sum by (job) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[1h]))
            /
            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1h]))
        - record: job:student_app_sli_latency_good:ratio_rate2h
          expr: |-
