; student-app runtime overrides (loaded after the image defaults).
; Most PHP settings are tuned via env vars of serversideup/php (PHP_MEMORY_LIMIT, PHP_FPM_PM_*, ...).

expose_php = Off

; APCu backs the Prometheus metrics registry (one shared memory segment per container).
apc.enabled = 1
apc.shm_size = 32M
apc.enable_cli = 0
