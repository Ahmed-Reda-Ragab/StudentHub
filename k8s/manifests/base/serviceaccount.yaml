# Dedicated identity for the app pods. The app never talks to the Kubernetes API, so no token
# is mounted (a stolen token from a compromised pod is worth nothing). On EKS this is also the
# account you would bind with Pod Identity if the app ever needed AWS APIs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-app
  labels:
    app.kubernetes.io/name: student-app
automountServiceAccountToken: false
