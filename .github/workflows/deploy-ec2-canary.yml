# Canary on the single EC2 host, automated (scenario 24).
#
# Runs /opt/student-app/lb/bin/canary.sh <image> through SSM Run Command (engine:
# deploy-ec2-ssm.yml). The new color gets STEPS % of traffic (weighted nginx upstream); after
# each step its own 5xx ratio on real pages is compared with MAX_ERROR_RATE. Breach => automatic
# abort: traffic back to 100% stable, canary.sh exits 2, this run ends "aborted" (red, with a
# clear summary). The runner generates real-page traffic so the gate has data to judge.
#
# Bad-release drill (scenario 24 "Break it"): slot_env=SRE_FAULT_ERROR_RATE=0.5 + expect_abort
# -> the run passes only if the gate aborts the release.
name: Deploy EC2 canary (SSM)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag in ECR (git short SHA). Empty = this commit's short SHA."
        type: string
        default: ""
      steps:
        description: "Traffic percentages for the canary, space separated (100 = promote)."
        type: string
        default: "10 25 50 100"
      step_seconds:
        description: "Seconds of traffic per step before the error-rate check."
        type: string
        default: "60"
      max_error_rate:
        description: "Abort when the canary's 5xx ratio on real pages exceeds this (0.01 = 1%)."
        type: string
        default: "0.01"
      min_requests:
        description: "Minimum canary requests per step to judge it (else hold, then abort)."
        type: string
        default: "10"
      slot_env:
        description: "Drill only: extra env for the canary color, e.g. SRE_FAULT_ERROR_RATE=0.5"
        type: string
        default: ""
      expect_abort:
        description: "Drill mode: the run passes only if the canary is aborted."
        type: boolean
        default: false
      generate_traffic:
        description: "Send real-page traffic from the runner during the canary (the lab has no users)."
        type: boolean
        default: true
      use_local_mysql:
        description: "MySQL runs as a container on the host (stack 20). Untick when DB_HOST is RDS."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  canary:
    # No concurrency here: the called job holds the per-host deploy lock.
    uses: ./.github/workflows/deploy-ec2-ssm.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: lab
      strategy: canary
      image_tag: ${{ inputs.image_tag }}
      canary_steps: ${{ inputs.steps }}
      step_seconds: ${{ inputs.step_seconds }}
      max_error_rate: ${{ inputs.max_error_rate }}
      min_requests: ${{ inputs.min_requests }}
      slot_env: ${{ inputs.slot_env }}
      expect_abort: ${{ inputs.expect_abort }}
      generate_traffic: ${{ inputs.generate_traffic }}
      use_local_mysql: ${{ inputs.use_local_mysql }}
