# Deploy to EKS (scenarios 65–69) — manual, from the Actions tab. The image must already be in ECR
# (built and pushed by the CI image workflow); this workflow never builds.
#
#   mode=helm        Plain Deployment RollingUpdate: helm upgrade --install --wait --rollback-on-failure.
#   mode=rollouts    Same chart as an Argo Rollouts canary (ALB weights 10→25→50→100 % + Prometheus
#                    analysis). Helm only submits the release; promotion/abort belong to Argo Rollouts.
#   mode=gitops-bump No cluster access at all: bump image.tag in values-eks.yaml and open a PR.
#                    Argo CD (k8s/argocd) deploys after merge; rollback = git revert.
#
# Switching between helm and rollouts replaces the Deployment by a Rollout (or back): pods are
# recreated once. Pick one mode per environment.
#
# Repository variables (CONVENTIONS §9): AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, EKS_CLUSTER.
name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag already in ECR (git short SHA, e.g. 3f2c1ab)"
        required: true
        type: string
      mode:
        description: "helm (Deployment) | rollouts (Argo Rollouts canary) | gitops-bump (PR for Argo CD)"
        required: true
        type: choice
        default: helm
        options:
          - helm
          - rollouts
          - gitops-bump

permissions:
  contents: read

# One deployment to the lab cluster at a time, and never cancel one half-way.
concurrency:
  group: deploy-eks-lab
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'student-app' }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  MODE: ${{ inputs.mode }}
  NS: student-app
  RELEASE: student-app
  CHART: k8s/helm/student-app
  HELM_VERSION: v4.3.2
  ARGO_ROLLOUTS_VERSION: v1.10.2

jobs:
  deploy:
    name: Deploy to EKS (${{ inputs.mode }})
    if: inputs.mode != 'gitops-bump'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: lab
    permissions:
      contents: read
      id-token: write          # GitHub OIDC → AWS STS, no long-lived keys
    steps:
      - uses: actions/checkout@v6

      - name: Validate the image tag (immutable git SHA only)
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::image_tag must be a git SHA (7-40 hex chars), got '$IMAGE_TAG' (CONVENTIONS §2: no latest/mutable tags)"
            exit 1
          fi

      - name: AWS credentials (OIDC → student-app-gha-deploy)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-eks-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: The image must exist in ECR (fail before touching the cluster)
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].{pushed:imagePushedAt,digest:imageDigest}' --output table

      - name: kubeconfig for the cluster
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          # Proves the EKS access entry for the deploy role works before anything is changed.
          kubectl version
          kubectl auth can-i create deployments.apps -n "$NS"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: kubectl-argo-rollouts plugin (pinned, checksum verified)
        if: inputs.mode == 'rollouts'
        run: |
          base="https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}"
          cd "$RUNNER_TEMP" || exit 1
          curl -fsSLO "$base/kubectl-argo-rollouts-linux-amd64"
          curl -fsSL "$base/argo-rollouts-checksums.txt" | grep ' kubectl-argo-rollouts-linux-amd64$' | sha256sum -c -
          sudo install -m 0755 kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Namespace (Pod Security "restricted" + ALB readiness gates)
        run: |
          kubectl apply -f k8s/manifests/base/namespace.yaml
          # The AWS LBC injects a readiness gate into new pods: Ready only once the ALB target is healthy.
          kubectl label namespace "$NS" elbv2.k8s.aws/pod-readiness-gate-inject=enabled --overwrite

      - name: "helm: upgrade --install, wait, roll back automatically on failure"
        if: inputs.mode == 'helm'
        timeout-minutes: 15
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # --wait                 success = every new pod Ready (readiness /ready + ALB readiness gate) and
          #                        the migration hook Job completed.
          # --rollback-on-failure  (Helm 3's --atomic): if that doesn't happen within --timeout — crash loop,
          #                        failing readiness, failed migration — Helm rolls the release back to the
          #                        last successful revision by itself, so the cluster is never left half-deployed.
          #                        maxUnavailable 0 means the old pods were serving the whole time anyway.
          helm upgrade --install "$RELEASE" "$CHART" -n "$NS" \
            -f "$CHART/values-eks.yaml" \
            --set-string image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set rollout.enabled=false \
            --wait --rollback-on-failure --timeout 10m \
            --description "deploy-eks run ${GITHUB_RUN_ID} (${GITHUB_ACTOR})"
          kubectl -n "$NS" rollout status "deployment/$RELEASE" --timeout 60s

      - name: "rollouts: submit the canary release"
        if: inputs.mode == 'rollouts'
        timeout-minutes: 15
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # No --wait / --rollback-on-failure here: a canary takes minutes and its rollback is Argo Rollouts'
          # job (analysis fails → abort → 100% stable). Helm still waits for its hooks (the migration Job).
          helm upgrade --install "$RELEASE" "$CHART" -n "$NS" \
            -f "$CHART/values-eks.yaml" \
            --set-string image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set rollout.enabled=true \
            --timeout 10m \
            --description "deploy-eks run ${GITHUB_RUN_ID} (${GITHUB_ACTOR})"
          kubectl argo rollouts get rollout "$RELEASE" -n "$NS"

      - name: "rollouts: follow the canary until promoted (Healthy) or aborted (Degraded)"
        if: inputs.mode == 'rollouts'
        timeout-minutes: 20
        run: |
          if kubectl argo rollouts status "$RELEASE" -n "$NS" --timeout 15m; then
            echo "Canary promoted: 100% of traffic on $IMAGE_TAG"
          else
            kubectl argo rollouts get rollout "$RELEASE" -n "$NS"
            kubectl -n "$NS" get analysisrun
            echo "::error::Rollout not Healthy: aborted by analysis (stable still serves 100%) or paused/timed out. See the job summary."
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          set +e
          host=$(kubectl -n "$NS" get ingress "$RELEASE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          {
            echo "## Deploy to EKS — mode \`$MODE\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | $EKS_CLUSTER ($AWS_REGION) |"
            echo "| Image | $ECR_REPOSITORY:$IMAGE_TAG |"
            echo "| ALB | ${host:-n/a} |"
            echo ""
            echo "### helm history"
            echo "~~~"
            helm -n "$NS" history "$RELEASE" --max 5
            echo "~~~"
            if [[ "$MODE" == rollouts ]]; then
              echo "### Rollout"
              echo "~~~"
              kubectl argo rollouts get rollout "$RELEASE" -n "$NS" --no-color
              echo "~~~"
              echo "Next steps:"
              echo "- watch: \`kubectl argo rollouts get rollout $RELEASE -n $NS --watch\`"
              echo "- skip the current pause: \`kubectl argo rollouts promote $RELEASE -n $NS\`"
              echo "- stop now, 100% back to stable: \`kubectl argo rollouts abort $RELEASE -n $NS\`"
              echo "- previous revision: \`kubectl argo rollouts undo $RELEASE -n $NS\`"
            else
              echo "Rollback: \`helm -n $NS rollback $RELEASE\` (already done automatically if this run failed)."
            fi
            if [[ -n "$host" ]]; then
              echo ""
              echo "Smoke: \`curl -s http://$host/ready\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          kubectl -n "$NS" get all,ingress,externalsecret,networkpolicy,pdb,hpa,job
          kubectl -n "$NS" describe pods | tail -150
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -60
          kubectl -n "$NS" logs -l app.kubernetes.io/name=student-app --all-containers --prefix --tail=80
          kubectl -n "$NS" describe externalsecret

  gitops-bump:
    name: GitOps bump (pull request, no cluster access)
    if: inputs.mode == 'gitops-bump'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: lab
    permissions:
      contents: write          # push the bump branch
      pull-requests: write     # open the PR
      id-token: write          # read-only ECR check through OIDC
    steps:
      - uses: actions/checkout@v6

      - name: Validate the image tag (immutable git SHA only)
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::image_tag must be a git SHA (7-40 hex chars), got '$IMAGE_TAG'"
            exit 1
          fi

      - name: AWS credentials (OIDC, used only to verify the image)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-gitops-bump-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Never propose an image that doesn't exist
        run: aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --output table

      - name: Bump image.repository / image.tag in values-eks.yaml
        env:
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'student-app' }}
        run: |
          # mikefarah/yq (preinstalled on GitHub runners) keeps comments; the tag stays a quoted string.
          yq -i '.image.repository = strenv(IMAGE_REPOSITORY) | .image.tag = strenv(IMAGE_TAG) | .image.tag style="double"' \
            "$CHART/values-eks.yaml"
          git diff -- "$CHART/values-eks.yaml"

      - name: Open / update the pull request
        id: pr
        # PRs opened with GITHUB_TOKEN don't trigger other workflows; pass a GitHub App / PAT token in
        # `token:` if CI must run on the bump PR. Repo setting needed: Actions → "Allow GitHub Actions to
        # create and approve pull requests".
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          base: ${{ github.ref_name }}
          branch: gitops/student-app-${{ inputs.image_tag }}
          add-paths: k8s/helm/student-app/values-eks.yaml
          commit-message: "deploy(eks): student-app ${{ inputs.image_tag }}"
          title: "deploy(eks): student-app → ${{ inputs.image_tag }}"
          body: |
            GitOps release request opened by `deploy-eks.yml` (run ${{ github.run_id }}, by @${{ github.actor }}).

            - Image: `${{ inputs.image_tag }}` (verified to exist in ECR)
            - File: `k8s/helm/student-app/values-eks.yaml` (`image.repository`, `image.tag`)

            Merging this PR is the deployment: Argo CD syncs `k8s/argocd/application.yaml`, Argo Rollouts runs
            the canary (10 → 25 → 50 → 100 % with Prometheus analysis) and aborts it on its own if the error
            rate goes over the gate. Rollback = revert this PR.
          labels: |
            gitops
            deploy
          delete-branch: true

      - name: Job summary
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## GitOps bump — $IMAGE_TAG"
            echo ""
            echo "Pull request (${PR_OPERATION:-none}): ${PR_URL:-no change — values-eks.yaml already at this tag}"
            echo ""
            echo "After merge: \`kubectl -n argocd get application student-app\` → Synced/Healthy, then"
            echo "\`kubectl argo rollouts get rollout $RELEASE -n $NS --watch\`."
          } >> "$GITHUB_STEP_SUMMARY"
