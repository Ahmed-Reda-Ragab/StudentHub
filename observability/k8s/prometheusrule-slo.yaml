            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[6h]))
        - record: job:student_app_sli_latency_good:ratio_rate1d
          expr: |-
            sum by (job) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[1d]))
            /
            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1d]))
        - record: job:student_app_sli_latency_good:ratio_rate3d
          expr: |-
            sum by (job) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[3d]))
            /
            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[3d]))
        - record: student_app:sli_latency_good:ratio_rate5m
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[5m]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
        - record: student_app:sli_latency_good:ratio_rate30m
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[30m]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30m]))
        - record: student_app:sli_latency_good:ratio_rate1h
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[1h]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1h]))
        - record: student_app:sli_latency_good:ratio_rate2h
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[2h]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[2h]))
        - record: student_app:sli_latency_good:ratio_rate6h
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[6h]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[6h]))
        - record: student_app:sli_latency_good:ratio_rate1d
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[1d]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1d]))
        - record: student_app:sli_latency_good:ratio_rate3d
          expr: |-
            sum(rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[3d]))
            /
            sum(rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[3d]))
    - name: student-app-sli-drill
      rules:
        - record: job:student_app_sli_drill_errors:ratio_rate5m
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[5m]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[5m]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[5m]))
        - record: job:student_app_sli_drill_errors:ratio_rate30m
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[30m]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[30m]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[30m]))
        - record: job:student_app_sli_drill_errors:ratio_rate1h
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[1h]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[1h]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[1h]))
        - record: job:student_app_sli_drill_errors:ratio_rate2h
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[2h]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[2h]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[2h]))
        - record: job:student_app_sli_drill_errors:ratio_rate6h
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[6h]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[6h]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[6h]))
        - record: job:student_app_sli_drill_errors:ratio_rate1d
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[1d]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[1d]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[1d]))
        - record: job:student_app_sli_drill_errors:ratio_rate3d
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error", status=~"5.."}[3d]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[3d]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route="sre-lab.error"}[3d]))
    - name: student-app-slo-30d
      interval: 5m  # 30-day windows are expensive and move slowly
      rules:
        - record: job:student_app_sli_availability_errors:ratio_rate30d
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[30d]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30d]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30d]))
        - record: job:student_app_sli_latency_good:ratio_rate30d
          expr: |-
            sum by (job) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics", le="0.3"}[30d]))
            /
            sum by (job) (rate(student_app_http_request_duration_seconds_count{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30d]))
        - record: student_app:slo_objective:ratio
          expr: |-
            vector(0.995)
          labels:
            slo: "availability"
        - record: student_app:slo_objective:ratio
          expr: |-
            vector(0.95)
          labels:
            slo: "latency"
    - name: student-app-slo-availability
      rules:
        - alert: SLOAvailabilityFastBurn
          expr: |-
            job:student_app_sli_availability_errors:ratio_rate1h > (14.4 * 0.005)
            and
            job:student_app_sli_availability_errors:ratio_rate5m > (14.4 * 0.005)
          for: 2m
          labels:
            severity: "page"
            slo: "availability"
            burn: "fast"
          annotations:
            summary: "{{ $labels.job }}: availability error budget burning faster than 14.4x"
            description: "{{ $value | humanizePercentage }} of requests failed (5xx) over the last 1h and the 5m window agrees. SLO 99.5% allows 0.5%; at this rate the 30-day budget is gone in about 2 days."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#sloavailabilityfastburn"
        - alert: SLOAvailabilitySlowBurn
          expr: |-
            job:student_app_sli_availability_errors:ratio_rate6h > (6 * 0.005)
            and
            job:student_app_sli_availability_errors:ratio_rate30m > (6 * 0.005)
          for: 15m
          labels:
            severity: "page"
            slo: "availability"
            burn: "slow"
          annotations:
            summary: "{{ $labels.job }}: availability error budget burning faster than 6x"
            description: "{{ $value | humanizePercentage }} of requests failed (5xx) over the last 6h and the 30m window agrees. SLO 99.5% allows 0.5%; at this rate the 30-day budget is gone in about 5 days."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#sloavailabilityslowburn"
        - alert: SLOAvailabilityBudgetBurn
          expr: |-
            job:student_app_sli_availability_errors:ratio_rate3d > (1 * 0.005)
            and
            job:student_app_sli_availability_errors:ratio_rate6h > (1 * 0.005)
          for: 1h
          labels:
            severity: "ticket"
            slo: "availability"
            burn: "budget"
          annotations:
            summary: "{{ $labels.job }}: availability error budget burning faster than 1x"
            description: "{{ $value | humanizePercentage }} of requests failed (5xx) over the last 3d and the 6h window agrees. SLO 99.5% allows 0.5%; at this rate the 30-day budget is gone in under 30 days."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#sloavailabilitybudgetburn"
    - name: student-app-slo-latency
      rules:
        - alert: SLOLatencyFastBurn
          expr: |-
            (1 - job:student_app_sli_latency_good:ratio_rate1h) > (14.4 * 0.05)
            and
            (1 - job:student_app_sli_latency_good:ratio_rate5m) > (14.4 * 0.05)
          for: 2m
          labels:
            severity: "page"
            slo: "latency"
            burn: "fast"
          annotations:
            summary: "{{ $labels.job }}: latency error budget burning faster than 14.4x"
            description: "{{ $value | humanizePercentage }} of requests were slower than 300ms over the last 1h and the 5m window agrees. SLO: 95% under 300ms (5% budget); at this rate the 30-day budget is gone in about 2 days."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slolatencyfastburn"
        - alert: SLOLatencySlowBurn
          expr: |-
            (1 - job:student_app_sli_latency_good:ratio_rate6h) > (6 * 0.05)
            and
            (1 - job:student_app_sli_latency_good:ratio_rate30m) > (6 * 0.05)
          for: 15m
          labels:
            severity: "page"
            slo: "latency"
            burn: "slow"
          annotations:
            summary: "{{ $labels.job }}: latency error budget burning faster than 6x"
            description: "{{ $value | humanizePercentage }} of requests were slower than 300ms over the last 6h and the 30m window agrees. SLO: 95% under 300ms (5% budget); at this rate the 30-day budget is gone in about 5 days."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slolatencyslowburn"
        - alert: SLOLatencyBudgetBurn
          expr: |-
            (1 - job:student_app_sli_latency_good:ratio_rate3d) > (1 * 0.05)
            and
            (1 - job:student_app_sli_latency_good:ratio_rate6h) > (1 * 0.05)
          for: 1h
          labels:
            severity: "ticket"
            slo: "latency"
            burn: "budget"
          annotations:
            summary: "{{ $labels.job }}: latency error budget burning faster than 1x"
            description: "{{ $value | humanizePercentage }} of requests were slower than 300ms over the last 3d and the 6h window agrees. SLO: 95% under 300ms (5% budget); at this rate the 30-day budget is gone in under 30 days."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slolatencybudgetburn"
        - alert: SLOLatencyTailP99High
          expr: |-
            histogram_quantile(0.99, sum by (job, le) (rate(student_app_http_request_duration_seconds_bucket{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[10m]))) > 1
          for: 15m
          labels:
            severity: "ticket"
            slo: "latency-tail"
          annotations:
            summary: "{{ $labels.job }}: p99 latency above 1s"
            description: "p99 over the last 10m is {{ $value | humanizeDuration }} (SLO: p99 < 1s), for 15 minutes."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slolatencytailp99high"
    - name: student-app-slo-drill
      rules:
        - alert: SLODrillFastBurn
          expr: |-
            job:student_app_sli_drill_errors:ratio_rate1h > (14.4 * 0.005)
            and
            job:student_app_sli_drill_errors:ratio_rate5m > (14.4 * 0.005)
          for: 2m
          labels:
            severity: "page"
            slo: "availability-drill"
            burn: "fast"
            drill: "true"
          annotations:
            summary: "DRILL {{ $labels.job }}: /sre-lab/error burning the drill budget faster than 14.4x"
            description: "{{ $value | humanizePercentage }} of /sre-lab/error requests failed over the last 1h and the 5m window agrees. Game-day traffic (loadtest/k6/error-budget-burn.js), not a user-facing incident."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slodrillfastburn"
        - alert: SLODrillSlowBurn
          expr: |-
            job:student_app_sli_drill_errors:ratio_rate6h > (6 * 0.005)
            and
            job:student_app_sli_drill_errors:ratio_rate30m > (6 * 0.005)
          for: 15m
          labels:
            severity: "page"
            slo: "availability-drill"
            burn: "slow"
            drill: "true"
          annotations:
            summary: "DRILL {{ $labels.job }}: /sre-lab/error burning the drill budget faster than 6x"
            description: "{{ $value | humanizePercentage }} of /sre-lab/error requests failed over the last 6h and the 30m window agrees. Game-day traffic (loadtest/k6/error-budget-burn.js), not a user-facing incident."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slodrillslowburn"
        - alert: SLODrillBudgetBurn
          expr: |-
            job:student_app_sli_drill_errors:ratio_rate3d > (1 * 0.005)
            and
            job:student_app_sli_drill_errors:ratio_rate6h > (1 * 0.005)
          for: 1h
          labels:
            severity: "ticket"
            slo: "availability-drill"
            burn: "budget"
            drill: "true"
          annotations:
            summary: "DRILL {{ $labels.job }}: /sre-lab/error burning the drill budget faster than 1x"
            description: "{{ $value | humanizePercentage }} of /sre-lab/error requests failed over the last 3d and the 6h window agrees. Game-day traffic (loadtest/k6/error-budget-burn.js), not a user-facing incident."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#slodrillbudgetburn"
    - name: student-app-symptoms
      rules:
        - alert: StudentAppNoTargetsUp
          expr: |-
            sum by (job) (up{job="student-app"}) == 0
          for: 2m
          labels:
            severity: "page"
          annotations:
            summary: "No student-app instance can be scraped"
            description: "Every target of job {{ $labels.job }} has been down for 2 minutes. One absent blue/green slot is normal; all of them means an outage or a broken scrape path."
            runbook_url: "https://github.com/Ahmed-Reda-Ragab/StudentHub/blob/master/docs/devops/scenarios/76-incident-response.md#studentappnotargetsup"
