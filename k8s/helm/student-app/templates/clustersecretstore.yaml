{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.store.create }}
{{- if ne .Values.externalSecrets.store.kind "ClusterSecretStore" }}
{{- fail "externalSecrets.store.create renders a ClusterSecretStore: set externalSecrets.store.kind=ClusterSecretStore" }}
{{- end }}
# ESO talks to SSM with its own controller identity (EKS Pod Identity on the external-secrets
# ServiceAccount, IAM role from Terraform 60-eks) — hence no `auth` block.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.store.name }}
  labels:
    {{- include "student-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.store.region }}
  # Cluster-wide object, but only this release's namespace may use it (least privilege).
  conditions:
    - namespaces:
        - {{ .Release.Namespace }}
{{- end }}
