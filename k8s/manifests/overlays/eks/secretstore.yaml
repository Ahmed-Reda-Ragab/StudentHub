# Namespaced store (the Helm chart can create a ClusterSecretStore instead). No `auth` block:
# ESO calls SSM with its own controller identity — the IAM role bound to the
# external-secrets/external-secrets ServiceAccount through EKS Pod Identity (Terraform 60-eks).
# That role only allows ssm:GetParametersByPath on /student-app/<env>/app (+ kms:Decrypt).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
  labels:
    app.kubernetes.io/name: student-app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
