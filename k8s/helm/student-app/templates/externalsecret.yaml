{{- if .Values.externalSecrets.enabled }}
{{- $path := trimSuffix "/" .Values.externalSecrets.ssmPath }}
# SSM Parameter Store → Secret existingSecret (CONVENTIONS §4): one parameter = one env var.
# external-secrets.io/v1 is the GA API (v1beta1 is no longer served by current ESO releases).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  labels:
    {{- include "student-app.labels" . | nindent 4 }}
  annotations:
    # Before the migrate Job (0) and the app (1) that consume the Secret.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.store.kind }}
    name: {{ .Values.externalSecrets.store.name }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
    # Parameters deleted in SSM → keep the last good Secret rather than breaking every new pod.
    deletionPolicy: Retain
  dataFrom:
    # GetParametersByPath (recursive, decrypted) — IAM: ssm:GetParametersByPath on the path + kms:Decrypt.
    - find:
        path: {{ $path }}
        name:
          regexp: ".*"
      # Keys arrive as full names (/student-app/lab/app/APP_KEY): keep only the last segment.
      rewrite:
        - regexp:
            source: {{ printf "^%s/(.*)$" (regexQuoteMeta $path) | quote }}
            target: "$1"
{{- end }}
