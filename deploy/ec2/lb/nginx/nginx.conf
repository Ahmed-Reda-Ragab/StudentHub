# Reverse proxy for the single-host zero-downtime scenarios.
# The routing itself is generated by ../bin/*.sh into ../state/nginx/ and applied
# with a graceful `nginx -s reload` (old workers finish in-flight requests).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    # Docker's embedded DNS; `resolve` on upstream servers re-resolves container IPs
    # when a slot is recreated (nginx >= 1.27.3).
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format lab '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time up=$upstream_addr ua="$http_user_agent"';
    access_log /dev/stdout lab;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Keep the original scheme when an ALB terminates TLS in front of this proxy.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    include /etc/nginx/state/upstreams.conf;
    include /etc/nginx/state/maps.conf;

    server {
        listen 80 default_server;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Zero-downtime safety net: if a slot refuses the connection (restarting),
        # retry the request on the other slot. Non-idempotent requests (POST) are
        # never retried once sent.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }

        # Prometheus scrapes each slot directly (127.0.0.1:8081 / :8082), never through the proxy.
        location = /metrics {
            return 404;
        }

        include /etc/nginx/state/routing.conf;
    }
}
