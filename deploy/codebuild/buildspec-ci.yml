# AWS CodeBuild — CI (scenario 35). Same gates as .github/workflows/ci.yml:
# Pint (code style) + the test suite on SQLite in memory (phpunit.xml defaults).
# Project: student-app-ci (infra/terraform/stacks/35-codebuild), image aws/codebuild/standard:8.0.
version: 0.2

env:
  variables:
    COMPOSER_NO_INTERACTION: "1"
    COMPOSER_CACHE_DIR: /root/.composer/cache

phases:
  install:
    runtime-versions:
      php: 8.3 # standard:8.0 ships 8.2-8.5; pin it so the image's default can move without breaking CI
    commands:
      - php -v
      - php -m | grep -qi pdo_sqlite
      - |
        if ! command -v composer >/dev/null 2>&1; then
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        fi
      - composer --version

  pre_build:
    commands:
      - composer install --prefer-dist --no-progress
      - cp .env.example .env
      - php artisan key:generate

  build:
    commands:
      - vendor/bin/pint --test
      - mkdir -p reports
      # JUnit -> CodeBuild report group "student-app-ci-phpunit" (Reports tab: pass/fail per test).
      - php artisan test --compact --log-junit reports/junit.xml

reports:
  phpunit:
    base-directory: reports
    files:
      - junit.xml
    file-format: JUNITXML

# LOCAL_CUSTOM_CACHE (project setting) keeps Composer's download cache on the build host.
cache:
  paths:
    - /root/.composer/cache/**/*
