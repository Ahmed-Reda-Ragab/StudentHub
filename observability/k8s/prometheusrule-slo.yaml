# The same SLO recording + burn-rate alerting rules as observability/prometheus/rules/,
# wrapped in a PrometheusRule for the Prometheus Operator (kube-prometheus-stack).
#
#   kubectl apply -f observability/k8s/prometheusrule-slo.yaml
#
# The `release: kube-prometheus-stack` label matches the chart's default ruleSelector
# (release name "kube-prometheus-stack"); kube-prometheus-stack-values.yaml also sets
# ruleSelectorNilUsesHelmValues=false so every PrometheusRule is picked up anyway.
# job="student-app" comes from the PodMonitor's jobLabel (app.kubernetes.io/name).
# Generated from the same source as the compose rules - change both together.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: student-app-slo
  namespace: student-app
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: student-app
    app.kubernetes.io/part-of: student-app-lab
spec:
  groups:
    - name: student-app-sli-availability
      rules:
        - record: job:student_app_sli_availability_errors:ratio_rate5m
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[5m]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[5m]))
        - record: job:student_app_sli_availability_errors:ratio_rate30m
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[30m]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30m]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[30m]))
        - record: job:student_app_sli_availability_errors:ratio_rate1h
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[1h]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1h]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[1h]))
        - record: job:student_app_sli_availability_errors:ratio_rate2h
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[2h]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[2h]))
            )
            /
            sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[2h]))
        - record: job:student_app_sli_availability_errors:ratio_rate6h
          expr: |-
            (
              sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics", status=~"5.."}[6h]))
              or
              0 * sum by (job) (rate(student_app_http_requests_total{route!~"sre-lab\\..*|up|health\\.ready|metrics"}[6h]))
