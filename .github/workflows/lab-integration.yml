# Lab integration — the "local lab" running on GitHub runners (no local Docker needed).
#
#   1. build two releases of the image (ci-v1, ci-v2) once
#   2. compose: app + MySQL → migrations, seeders, smoke tests, login flow, k6 smoke+load (SLO thresholds),
#      SRE drills (lab disabled → 404, unhealthy release, boot-failing release)
#   3. zero-downtime: the real deploy/ec2/lb scripts with a probe asserting 0 failed requests:
#      blue/green → rollback → rolling → canary (promote) → canary (bad release, auto-abort) → A/B → shadow
#
# Scenarios 10, 12, 22–26, 74. Kubernetes equivalent: k8s-integration.yml.
name: Lab integration

on:
  push:
    branches: [master, main, devops-lab]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "routes/**"
      - "database/**"
      - "resources/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "deploy/**"
      - "loadtest/**"
      - "composer.lock"
      - "package-lock.json"
      - ".github/workflows/lab-integration.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-images:
    name: Build ci-v1 + ci-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build ci-v1
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: student-app:ci-v1
          build-args: APP_VERSION=ci-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ci-v2 (same code, new release id — only the last layer differs)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: student-app:ci-v2
          build-args: APP_VERSION=ci-v2
          cache-from: type=gha
      - run: docker save student-app:ci-v1 student-app:ci-v2 | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  compose:
    name: Compose · smoke · k6 · SRE drills
    needs: build-images
    runs-on: ubuntu-latest
    env:
      LAB_IMAGE: student-app:ci-v1
      APP_VERSION: ci-v1
      LOADTEST_USERS: "5"
      LOADTEST_STUDENTS_PER_USER: "20"
      BASE: http://localhost:8080
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load

      - name: APP_KEY for this run
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start app + MySQL
        run: docker compose up -d --no-build --wait app mysql

      - name: Migrate and seed (one-off commands in the running container)
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --class=DemoSeeder --force
          docker compose exec -T app php artisan db:seed --class=LoadTestSeeder --force

      - name: Smoke tests
        run: |
          set -x
          curl -fsS "$BASE/up" >/dev/null
          curl -fsS "$BASE/ready" | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS "$BASE/ready" | grep -q '"version":"ci-v1"'
          curl -fsS "$BASE/sre-lab/ping" | grep -q '"status":"ok"'
          curl -fsS "$BASE/sre-lab/db/heavy" | grep -q '"tenants"'
          curl -fsS "$BASE/metrics" | grep -q 'student_app_app_info{version="ci-v1"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/sre-lab/error?rate=1&code=503")" = 503

      - name: Real login flow (CSRF + session in MySQL)
        run: |
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" "$BASE/login" | grep -o 'name="_token" value="[^"]*"' | head -1 | cut -d'"' -f4)
          test -n "$token"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -c "$jar" \
            --data-urlencode "_token=$token" --data-urlencode "email=demo@example.com" --data-urlencode "password=password" \
            "$BASE/login")
          test "$code" = 302
          curl -fsS -b "$jar" "$BASE/students" | grep -q 'logout'

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.4.0" # same pin as perf-gate.yml / observability-lint.yml

      - name: k6 smoke
        run: k6 run -e BASE_URL="$BASE" -e LOADTEST_USERS="$LOADTEST_USERS" loadtest/k6/smoke.js

      - name: k6 load (thresholds = SLOs; fails the job when breached)
        run: k6 run -e BASE_URL="$BASE" -e LOADTEST_USERS="$LOADTEST_USERS" -e VUS=5 -e DURATION=45s loadtest/k6/load.js

      - name: "Drill: lab disabled → /sre-lab is 404"
        run: |
          SRE_LAB_ENABLED=false docker compose up -d --no-build --wait app
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/sre-lab/ping")" = 404
          curl -fsS "$BASE/ready" >/dev/null

      - name: "Drill: unhealthy release → /up 500, /ready 503"
        run: |
          SRE_FAULT_UNHEALTHY=true docker compose up -d --no-build app
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/up" || true)
            [ "$code" = 500 ] && break; sleep 2
          done
          test "$code" = 500
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/ready")" = 503

      - name: "Drill: release that cannot boot → container exits non-zero"
        run: |
          if SRE_FAULT_BOOT_FAIL=true docker compose run --rm --no-deps app php -v; then
            echo "expected the container to refuse to start"; exit 1
          fi
          docker compose up -d --no-build --wait app   # back to a healthy release

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

  zero-downtime:
    name: Zero-downtime scripts (single host)
    needs: build-images
    runs-on: ubuntu-latest
    env:
      APP_ENV_FILE: ${{ github.workspace }}/.lab/app.env
      MYSQL_ENV_FILE: ${{ github.workspace }}/.lab/mysql.env
      SKIP_PULL: "true"
      LB_HTTP_PORT: "80"
      LB: deploy/ec2/lb/bin
      PROBE: deploy/scripts/with-probe.sh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: images
      - run: gunzip -c images.tar.gz | docker load

      - name: Host env files (what render-env-from-ssm.sh writes on EC2)
        run: |
          mkdir -p .lab
          cat > "$APP_ENV_FILE" <<EOF
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=http://localhost
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_DATABASE=student_app
          DB_USERNAME=student
          DB_PASSWORD=ci-secret
          SESSION_DRIVER=database
          CACHE_STORE=database
          SRE_LAB_ENABLED=true
          METRICS_ENABLED=true
          EOF
          cat > "$MYSQL_ENV_FILE" <<EOF
          MYSQL_DATABASE=student_app
          MYSQL_USER=student
          MYSQL_PASSWORD=ci-secret
          MYSQL_ROOT_PASSWORD=ci-root
          EOF
          sed -i 's/^ *//' "$APP_ENV_FILE" "$MYSQL_ENV_FILE"

      - name: init (mysql + blue=ci-v1 + nginx)
        run: bash $LB/init.sh student-app:ci-v1

      - name: Blue/Green ci-v1 → ci-v2 (0 failed requests)
        run: |
          bash $PROBE -- bash $LB/bluegreen.sh student-app:ci-v2
          curl -fsS http://localhost/ready | grep -q '"version":"ci-v2"'

      - name: Rollback (instant, 0 failed requests)
        run: |
          bash $PROBE -- bash $LB/rollback.sh
          curl -fsS http://localhost/ready | grep -q '"version":"ci-v1"'

      - name: Rolling ci-v1 → ci-v2 across both slots (0 failed requests)
        run: |
          bash $PROBE -- bash $LB/rolling.sh student-app:ci-v2
          curl -fsS http://127.0.0.1:8081/ready | grep -q '"version":"ci-v2"'
          curl -fsS http://127.0.0.1:8082/ready | grep -q '"version":"ci-v2"'

      - name: Canary ci-v2 → ci-v1, healthy → promoted (real-page traffic, 0 failures)
        run: |
          PROBE_URL=http://localhost/login PROBE_INTERVAL=0.02 \
          STEPS="25 50 100" STEP_SECONDS=10 MIN_REQUESTS=5 \
            bash $PROBE -- bash $LB/canary.sh student-app:ci-v1
          curl -fsS http://localhost/ready | grep -q '"version":"ci-v1"'

      - name: Canary with a BAD release → metric gate aborts, traffic back on stable
        run: |
          # user traffic on real pages (the canary will fail ~50% of its share — that is the point)
          STOP_FILE=/tmp/stop-traffic bash deploy/scripts/probe.sh http://localhost/login 0 0.02 > /tmp/traffic.log 2>&1 &
          # availability of the stable path must stay perfect
          SLOT_ENV="SRE_FAULT_ERROR_RATE=0.5" STEPS="25 100" STEP_SECONDS=10 MIN_REQUESTS=5 EXPECT_EXIT=2 \
            bash $PROBE -- bash $LB/canary.sh student-app:ci-v2
          touch /tmp/stop-traffic; sleep 1
          cat /tmp/traffic.log | tail -15
          curl -fsS http://localhost/ready | grep -q '"version":"ci-v1"'

      - name: A/B test (forced header + sticky cookie)
        run: |
          bash $LB/ab-test.sh student-app:ci-v2 30
          source deploy/ec2/lb/state/release.env
          variant=$([ "$ACTIVE" = blue ] && echo green || echo blue)
          curl -fsS -H "X-Variant: $variant" http://localhost/ready | grep -q "\"color\":\"$variant\""
          curl -fsS -b "ab_variant=$ACTIVE" http://localhost/ready | grep -q "\"color\":\"$ACTIVE\""
          curl -fsS -D - -o /dev/null http://localhost/ready | grep -qi 'set-cookie: ab_variant='
          bash deploy/scripts/version-split.sh http://localhost/ready 50
          bash $LB/ab-test.sh stop

      - name: Shadow traffic (GETs mirrored, responses discarded)
        run: |
          bash $LB/shadow.sh student-app:ci-v2
          source deploy/ec2/lb/state/release.env
          shadow=$([ "$ACTIVE" = blue ] && echo green || echo blue)
          port=$([ "$shadow" = blue ] && echo 8081 || echo 8082)
          count() { curl -fsS "http://127.0.0.1:$port/metrics" | awk '/http_requests_total\{method="GET",route="health.ready"/ {s+=$NF} END {print s+0}'; }
          before=$(count)
          for i in $(seq 1 20); do curl -fsS http://localhost/ready | grep -q "\"color\":\"$ACTIVE\""; done
          sleep 2
          after=$(count)
          echo "shadow slot saw $((after - before)) mirrored requests"
          test $((after - before)) -ge 15
          bash $LB/shadow.sh stop

      - name: Final status
        if: always()
        run: bash $LB/status.sh || true

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/ec2/lb/docker-compose.yml --env-file deploy/ec2/lb/state/release.env logs --tail=150
