# Plain-YAML base (scenario 60): readable, one object per file, no templating.
#   kubectl kustomize k8s/manifests/overlays/kind      # render
#   kubectl apply -k k8s/manifests/overlays/kind       # apply
# secret.example.yaml is intentionally NOT listed: real secrets never come from git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: student-app
labels:
  - pairs:
      app.kubernetes.io/part-of: student-app-lab
      app.kubernetes.io/managed-by: kustomize
    includeTemplates: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - migrate-job.yaml
  - networkpolicy.yaml
